/* tcycled components — reference CSS. Every class is prefixed tc-. Needs tokens.css. */
.tc { font-family: var(--font-text); color: var(--ink); }
.tc *, .tc *::before, .tc *::after { box-sizing: border-box; }
.tc h1, .tc h2, .tc h3, .tc p { margin: 0; }

/* Screen scaffold (phone artboards, 390 x 844) */
.tc-screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-text); }
.tc-scroll { position: absolute; top: 0; left: 0; right: 0; bottom: var(--tabbar-height); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.tc-scroll::-webkit-scrollbar { display: none; }
.tc-scroll--full { bottom: 0; }
.tc-pad { padding-left: var(--screen-margin); padding-right: var(--screen-margin); }
.tc-stack { display: flex; flex-direction: column; }

/* Buttons */
.tc-btn { appearance: none; border: 0; margin: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--button-height); padding: 0 24px; border-radius: var(--radius-pill); font: 600 17px/24px var(--font-text); text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform .14s cubic-bezier(.2, .8, .2, 1), background-color .14s; }
.tc-btn:active { transform: scale(.98); }
.tc-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }
.tc-btn svg { width: 22px; height: 22px; flex: none; }
.tc-btn--primary { background: var(--loop); color: var(--on-loop); }
.tc-btn--primary:active { background: var(--loop-pressed); }
.tc-btn--secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.tc-btn--ghost { background: transparent; color: var(--loop); padding: 0 12px; }
.tc-btn--sprout { background: var(--sprout); color: var(--on-sprout); }
.tc-btn--on-dark { background: transparent; color: var(--on-evergreen); box-shadow: inset 0 0 0 1.5px var(--on-evergreen-muted); }
.tc-btn--danger { background: var(--surface); color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.tc-btn--block { display: flex; width: 100%; }
.tc-btn--sm { height: 40px; padding: 0 16px; font-size: 15px; line-height: 20px; }
.tc-btn--sm svg { width: 18px; height: 18px; }
.tc-btn[disabled], .tc-btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }

/* Icon button (44 x 44) */
.tc-iconbtn { appearance: none; border: 0; width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); cursor: pointer; position: relative; text-decoration: none; }
.tc-iconbtn svg { width: 22px; height: 22px; }
.tc-iconbtn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }
.tc-iconbtn--plain { background: transparent; box-shadow: none; }
.tc-iconbtn--on-dark { background: rgba(245, 243, 236, .12); color: var(--on-evergreen); box-shadow: none; }
.tc-iconbtn__badge { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--coral); color: var(--surface); font: 700 11px/18px var(--font-text); text-align: center; box-shadow: 0 0 0 2px var(--surface); }

/* Text fields */
.tc-field { display: flex; flex-direction: column; gap: 8px; }
.tc-field__label { font: 600 13px/18px var(--font-text); color: var(--ink-muted); }
.tc-input { appearance: none; width: 100%; height: 54px; padding: 0 16px; border-radius: var(--radius-md); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 400 17px/24px var(--font-text); box-sizing: border-box; }
.tc-input::placeholder { color: var(--ink-subtle); }
.tc-input:focus { outline: none; border-color: var(--loop); box-shadow: 0 0 0 3px var(--leaf-tint); }
.tc-field__help { font: 500 13px/18px var(--font-text); color: var(--ink-subtle); }
.tc-field--error .tc-input { border-color: var(--danger); }
.tc-field--error .tc-field__help { color: var(--danger); }
.tc-search { position: relative; display: flex; align-items: center; }
.tc-search svg { position: absolute; left: 16px; width: 20px; height: 20px; color: var(--ink-subtle); pointer-events: none; }
.tc-search .tc-input { padding-left: 46px; border-radius: var(--radius-pill); border-color: var(--line); height: 48px; }

/* Segmented control */
.tc-seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--radius-pill); background: var(--surface-muted); }
.tc-seg__opt { flex: 1; appearance: none; border: 0; height: 36px; border-radius: var(--radius-pill); background: transparent; color: var(--ink-muted); font: 600 15px/20px var(--font-text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.tc-seg__opt svg { width: 18px; height: 18px; }
.tc-seg__opt[aria-selected="true"], .tc-seg__opt.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
.tc-seg--on-dark { background: rgba(245, 243, 236, .12); }
.tc-seg--on-dark .tc-seg__opt { color: var(--on-evergreen-muted); }
.tc-seg--on-dark .tc-seg__opt.is-on { background: var(--sprout); color: var(--on-sprout); box-shadow: none; }

/* Chips (filters) */
.tc-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tc-chips--scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tc-chip { appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 15px/20px var(--font-text); cursor: pointer; white-space: nowrap; text-decoration: none; flex: none; }
.tc-chip svg { width: 18px; height: 18px; }
.tc-chip.is-on, .tc-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* Switch */
.tc-switch { appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 51px; height: 31px; border-radius: var(--radius-pill); background: var(--surface-muted); position: relative; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--line-strong); transition: background-color .2s; }
.tc-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.tc-switch:checked { background: var(--loop); box-shadow: none; }
.tc-switch:checked::after { transform: translateX(20px); }
.tc-switch:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }

/* Cards, lists, rows */
.tc-card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 20px; color: var(--ink); }
.tc-card--flat { box-shadow: none; border: 1px solid var(--line); }
.tc-card--evergreen { background: var(--evergreen); color: var(--on-evergreen); box-shadow: none; }
.tc-card--leaf { background: var(--leaf-tint); box-shadow: none; }
.tc-card--tide { background: var(--tide-tint); box-shadow: none; }
.tc-card--coral { background: var(--coral-tint); box-shadow: none; }
.tc-list { display: flex; flex-direction: column; }
.tc-row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 0; color: inherit; text-decoration: none; border: 0; background: transparent; width: 100%; text-align: left; font: inherit; box-sizing: border-box; }
.tc-list > .tc-row + .tc-row { border-top: 1px solid var(--line); }
.tc-row__icon { flex: none; width: 40px; height: 40px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--surface-muted); color: var(--ink); }
.tc-row__icon svg { width: 22px; height: 22px; }
.tc-row__icon--leaf { background: var(--leaf-tint); color: var(--leaf); }
.tc-row__icon--tide { background: var(--tide-tint); color: var(--tide); }
.tc-row__icon--coral { background: var(--coral-tint); color: var(--coral); }
.tc-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tc-row__title { font: 600 17px/22px var(--font-text); color: var(--ink); }
.tc-row__meta { font: 400 15px/20px var(--font-text); color: var(--ink-muted); }
.tc-row__end { flex: none; display: flex; align-items: center; gap: 8px; color: var(--ink-subtle); font: 500 15px/20px var(--font-text); }
.tc-row__end svg { width: 20px; height: 20px; }

/* Status pills (always words) */
.tc-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font: 600 13px/18px var(--font-text); background: var(--surface-muted); color: var(--ink-muted); white-space: nowrap; }
.tc-pill svg { width: 14px; height: 14px; }
.tc-pill--leaf { background: var(--leaf-tint); color: var(--leaf); }
.tc-pill--tide { background: var(--tide-tint); color: var(--tide); }
.tc-pill--coral { background: var(--coral-tint); color: var(--coral); }
.tc-pill--warning { background: var(--warning-tint); color: var(--warning); }
.tc-pill--sprout { background: var(--sprout); color: var(--on-sprout); }
.tc-pill--on-dark { background: rgba(245, 243, 236, .14); color: var(--on-evergreen); }

/* Section header band with a backdrop (artboards set background-image) */
.tc-band { position: relative; height: var(--band-height); border-radius: 0 0 var(--radius-xl) var(--radius-xl); overflow: hidden; background-size: cover; background-position: center; }
.tc-band--leaf { background-color: var(--leaf-tint); }
.tc-band--tide { background-color: var(--tide-tint); }
.tc-band--coral { background-color: var(--coral-tint); }
.tc-band--evergreen { background-color: var(--evergreen); color: var(--on-evergreen); }
.tc-band__top { position: absolute; top: 54px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tc-band__bottom { position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tc-band__title { margin: 0; font: 600 28px/32px var(--font-display); letter-spacing: -0.015em; }
.tc-band__sub { margin: 4px 0 0; font: 400 15px/20px var(--font-text); color: var(--ink-muted); }

/* Compact top bar for pushed screens */
.tc-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 50px 12px 8px; min-height: 56px; }
.tc-topbar__title { flex: 1; text-align: center; font: 600 17px/22px var(--font-text); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc-topbar__spacer { width: 44px; flex: none; }

/* Tab bar: Home, Wallet, Scan (raised), Partners, Impact */
.tc-tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabbar-height); padding: 6px 6px 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; background: var(--surface); border-top: 1px solid var(--line); box-sizing: border-box; z-index: 5; }
.tc-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; min-height: 44px; color: var(--ink-subtle); text-decoration: none; font: 600 11px/14px var(--font-text); letter-spacing: .01em; }
.tc-tab svg { width: 26px; height: 26px; }
.tc-tab.is-on, .tc-tab[aria-current="page"] { color: var(--loop); }
.tc-tab--scan { position: relative; top: -24px; gap: 5px; color: var(--ink); }
.tc-tab__fab { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--evergreen); color: var(--sprout); box-shadow: var(--shadow-raised), 0 0 0 5px var(--surface); }
.tc-tab__fab svg { width: 28px; height: 28px; }

/* Onboarding progress: segments, not dots */
.tc-steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.tc-steps__seg { height: 4px; border-radius: var(--radius-pill); background: var(--line); }
.tc-steps__seg.is-done { background: var(--ink); }
.tc-steps--on-dark .tc-steps__seg { background: rgba(245, 243, 236, .25); }
.tc-steps--on-dark .tc-steps__seg.is-done { background: var(--on-evergreen); }

/* Return tracker: a bar plus plain rows in order (no check icons, no numbered circles) */
.tc-track { display: flex; flex-direction: column; gap: 12px; }
.tc-track__bar { height: 8px; border-radius: var(--radius-pill); background: var(--surface-muted); overflow: hidden; }
.tc-track__fill { height: 100%; border-radius: inherit; background: var(--loop); }
.tc-track__steps { display: flex; flex-direction: column; }
.tc-track__step { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font: 400 15px/20px var(--font-text); color: var(--ink-subtle); }
.tc-track__step.is-done { color: var(--ink-muted); }
.tc-track__step.is-now { color: var(--ink); font-weight: 600; }
.tc-track__when { font: 500 13px/20px var(--font-text); color: var(--ink-subtle); white-space: nowrap; }

/* Voucher */
.tc-voucher { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 18px 22px 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); color: var(--ink); text-decoration: none; overflow: hidden; }
.tc-voucher::before, .tc-voucher::after { content: ""; position: absolute; top: 58%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: var(--paper); }
.tc-voucher::before { left: -10px; }
.tc-voucher::after { right: -10px; }
.tc-voucher__brand { font: 600 13px/18px var(--font-text); color: var(--ink-muted); }
.tc-voucher__value { font: 600 34px/38px var(--font-display); letter-spacing: -0.02em; }
.tc-voucher__terms { grid-column: 1 / -1; font: 400 15px/20px var(--font-text); color: var(--ink-muted); }
.tc-voucher__meta { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; margin-top: 10px; border-top: 1.5px dashed var(--line); font: 500 13px/18px var(--font-text); color: var(--ink-subtle); }
.tc-voucher--sprout { background: var(--sprout); color: var(--on-sprout); box-shadow: none; }
.tc-voucher--sprout .tc-voucher__brand, .tc-voucher--sprout .tc-voucher__terms, .tc-voucher--sprout .tc-voucher__meta { color: var(--on-sprout); }
.tc-voucher--sprout .tc-voucher__meta { border-top-color: rgba(15, 42, 29, .3); }

/* Metric tiles */
.tc-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tc-metric { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); color: inherit; text-decoration: none; text-align: left; border: 0; font: inherit; }
.tc-metric__icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf-tint); color: var(--leaf); }
.tc-metric__icon svg { width: 20px; height: 20px; }
.tc-metric__value { font: 600 24px/28px var(--font-display); letter-spacing: -0.015em; color: var(--ink); }
.tc-metric__label { font: 400 15px/20px var(--font-text); color: var(--ink-muted); }

/* Bottom sheet */
.tc-scrim { position: absolute; inset: 0; background: var(--scrim); }
.tc-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet); padding: 10px 20px 34px; box-sizing: border-box; }
.tc-sheet--static { position: relative; }
.tc-sheet__grabber { width: 36px; height: 5px; border-radius: var(--radius-pill); background: var(--line); margin: 0 auto 18px; }

/* Toast */
.tc-toast { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--ink); color: var(--paper); font: 500 15px/20px var(--font-text); box-shadow: var(--shadow-raised); }
.tc-toast svg { width: 20px; height: 20px; }

/* Empty state */
.tc-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 24px; }
.tc-empty img { width: 168px; height: 168px; }
.tc-empty__title { margin: 8px 0 0; font: 600 22px/28px var(--font-display); letter-spacing: -0.01em; color: var(--ink); }
.tc-empty__text { margin: 0; font: 400 17px/24px var(--font-text); color: var(--ink-muted); max-width: 300px; }

/* Scroll hint: shows only while more content sits below the fold */
.tc-scrollhint { position: absolute; left: 0; right: 0; height: 112px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; background: linear-gradient(to bottom, transparent, var(--paper) 72%); pointer-events: none; box-sizing: border-box; z-index: 4; }
.tc-scrollhint__pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--surface); color: var(--ink-muted); box-shadow: var(--shadow-card); font: 600 13px/18px var(--font-text); }
.tc-scrollhint__pill svg { width: 16px; height: 16px; }

/* Avatar */
.tc-avatar { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; background: var(--leaf-tint); color: var(--leaf); font: 600 17px/1 var(--font-display); flex: none; text-decoration: none; }
.tc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.tc-avatar--lg { width: 96px; height: 96px; font-size: 34px; }

/* Charity donation */
.tc-donation { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: var(--radius-lg); background: var(--coral-tint); color: var(--ink); text-decoration: none; }
.tc-donation__icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--coral); }
.tc-donation__icon svg { width: 22px; height: 22px; }
.tc-donation__value { font: 600 22px/28px var(--font-display); letter-spacing: -0.01em; }
.tc-donation__text { font: 400 15px/20px var(--font-text); color: var(--ink-muted); }

/* Use of goods: one stacked bar in waste-hierarchy order, values in the legend */
.tc-goods { display: flex; flex-direction: column; gap: 12px; }
.tc-goods__bar { display: flex; height: 44px; border-radius: var(--radius-md); overflow: hidden; gap: 2px; background: var(--surface); }
.tc-goods__seg { min-width: 6px; }
.tc-goods__seg--reuse, .tc-goods__swatch--reuse { background: var(--data-reuse); }
.tc-goods__seg--refashion, .tc-goods__swatch--refashion { background: var(--data-refashion); }
.tc-goods__seg--closed, .tc-goods__swatch--closed { background: var(--data-recycle-closed); }
.tc-goods__seg--open, .tc-goods__swatch--open { background: var(--data-recycle-open); }
.tc-goods__seg--recovery, .tc-goods__swatch--recovery { background: var(--data-recovery); }
.tc-goods__legend { display: flex; flex-direction: column; }
.tc-goods__row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.tc-goods__swatch { width: 14px; height: 14px; border-radius: 4px; }
.tc-goods__name { font: 600 15px/20px var(--font-text); color: var(--ink); }
.tc-goods__desc { font: 400 13px/18px var(--font-text); color: var(--ink-muted); }
.tc-goods__pct { font: 600 17px/22px var(--font-display); color: var(--ink); }

/* Sections and links */
.tc-section { display: flex; flex-direction: column; gap: 12px; }
.tc-section__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tc-section__title { margin: 0; font: 600 22px/28px var(--font-display); letter-spacing: -0.01em; color: var(--ink); }
.tc-link { color: var(--loop); font: 600 15px/20px var(--font-text); text-decoration: none; }
.tc-link:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }

/* Disclosure (inline "more" text that opens in place) */
.tc-disclosure { border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.tc-disclosure summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; font: 600 15px/20px var(--font-text); color: var(--ink); cursor: pointer; }
.tc-disclosure summary::-webkit-details-marker { display: none; }
.tc-disclosure summary svg { width: 18px; height: 18px; color: var(--ink-subtle); transition: transform .2s; }
.tc-disclosure[open] summary svg { transform: rotate(180deg); }
.tc-disclosure__body { padding: 0 16px 16px; font: 400 15px/21px var(--font-text); color: var(--ink-muted); }

/* Partner marquee (welcome screen): names stand in for partner-supplied logos */
.tc-marquee { display: flex; gap: 10px; align-items: center; justify-content: center; }
.tc-partner { flex: none; width: 92px; height: 52px; border-radius: var(--radius-md); background: rgba(245, 243, 236, .08); display: grid; place-items: center; color: var(--on-evergreen-muted); font: 700 14px/1 var(--font-text); letter-spacing: .02em; }
.tc-partner.is-center { width: 128px; height: 68px; background: var(--surface); color: var(--ink); font-size: 18px; box-shadow: var(--shadow-raised); }
