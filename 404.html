<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Artus Group</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #fff; color: #0B1B3A;
      font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0 0 auto 0; height: 3px;
      background: linear-gradient(90deg, #22CFA0, #01AEE2 55%, #0B3F8F);
    }
    main { box-sizing: border-box; width: 100%; max-width: 560px; padding: 32px 24px; text-align: center; }
    .name { margin: 0 0 22px; font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #0B3F8F; }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; font-weight: 600; letter-spacing: -.02em; }
    .note { margin: 14px 0 0; color: #55647D; }
  </style>
</head>
<body>
  <main>
    <p class="name">Artus Group</p>
    <h1>This website is temporarily unavailable.</h1>
    <p class="note">Please check back soon.</p>
  </main>
</body>
</html>
